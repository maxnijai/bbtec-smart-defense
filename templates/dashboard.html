<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BBTEC Smart Defense Pro</title>
  <style>
    :root{--bg:#0b1020;--panel:#121a2c;--panel2:#17223a;--border:#2a3859;--txt:#e9eefc;--muted:#8fa0c1;--blue:#58a6ff;--green:#3fb950;--red:#ff5f57;--amber:#e3b341;--purple:#bc8cff}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#08111f,#10182b);color:var(--txt);font-family:Inter,Arial,'Noto Sans Thai',sans-serif;font-size:14px} button,input,select,textarea{font:inherit}
    .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.login-card{width:380px;background:rgba(18,26,44,.95);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    h1{font-size:24px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px;margin-bottom:22px}.inp{width:100%;padding:12px 14px;border-radius:12px;background:#0b1325;color:var(--txt);border:1px solid var(--border);margin:7px 0 12px}.btn{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;color:white;background:var(--blue);font-weight:700}.btn.ghost{background:#24314f;color:var(--txt)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.amber{background:var(--amber);color:#111}.btn.purple{background:var(--purple)}.btn:disabled{opacity:.45;cursor:not-allowed}
    .app{display:none}.top{height:64px;background:rgba(18,26,44,.92);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 18px;position:sticky;top:0;z-index:10}.logo{width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 18px var(--green)}.brand{font-weight:900;font-size:18px}.me{margin-left:auto;color:var(--muted);font-size:12px}.wrap{padding:18px;max-width:1600px;margin:0 auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px;margin-bottom:14px}.card{background:rgba(18,26,44,.9);border:1px solid var(--border);border-radius:18px;padding:16px}.klabel{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}.kval{font-size:28px;font-weight:900;margin-top:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.toolbar input,.toolbar select{padding:9px 12px;background:#0b1325;border:1px solid var(--border);border-radius:12px;color:var(--txt)}
    table{width:100%;border-collapse:collapse;background:rgba(18,26,44,.82);border:1px solid var(--border);border-radius:16px;overflow:hidden} th,td{padding:10px 11px;border-bottom:1px solid rgba(42,56,89,.75);vertical-align:top} th{font-size:11px;text-align:left;color:var(--muted);text-transform:uppercase;background:#17223a;cursor:pointer;white-space:nowrap} tr:hover td{background:rgba(88,166,255,.06)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.pill{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:800;border:1px solid var(--border)}.p1{color:var(--blue);background:rgba(88,166,255,.12)}.p2{color:var(--amber);background:rgba(227,179,65,.12)}.p3{color:var(--purple);background:rgba(188,140,255,.12)}.pf{color:var(--green);background:rgba(63,185,80,.12)}.warn{color:var(--amber)}.err{color:var(--red)}.ok{color:var(--green)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.show{display:flex}.box{width:min(1100px,96vw);max-height:92vh;overflow:auto;background:#10182b;border:1px solid var(--border);border-radius:22px;padding:18px}.box-head{display:flex;gap:10px;align-items:center;margin-bottom:14px}.box-head h2{margin:0;font-size:20px}.close{margin-left:auto}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.field{background:#0b1325;border:1px solid var(--border);border-radius:14px;padding:10px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field div{word-break:break-word}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form-grid textarea,.form-grid input,.form-grid select{width:100%;padding:10px;border-radius:12px;background:#0b1325;color:var(--txt);border:1px solid var(--border)}textarea{min-height:80px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.small{font-size:12px;color:var(--muted)}
    @media(max-width:900px){.grid,.detail-grid,.form-grid{grid-template-columns:1fr}.top{height:auto;flex-wrap:wrap;padding:12px}.me{margin-left:0}}
  </style>
</head>
<body>
<section id="login" class="login">
  <div class="login-card">
    <h1>BBTEC Smart Defense</h1><div class="sub">Penalty Ticket Workflow • Pro Stable</div>
    <input id="u" class="inp" placeholder="User"><input id="p" class="inp" placeholder="Password" type="password">
    <button class="btn" style="width:100%" onclick="login()">Login</button>
    <div id="loginMsg" class="small err" style="margin-top:12px"></div>
  </div>
</section>
<section id="app" class="app">
  <div class="top"><span class="logo"></span><span class="brand">BBTEC Smart Defense Pro</span><span id="me" class="me"></span><button class="btn ghost" onclick="logout()">Logout</button></div>
  <div class="wrap">
    <div id="warning"></div>
    <div class="grid"><div class="card"><div class="klabel">Total Ticket</div><div id="kTotal" class="kval">0</div></div><div class="card"><div class="klabel">Penalty</div><div id="kPenalty" class="kval">0</div></div><div class="card"><div class="klabel">Step1</div><div id="kStep1" class="kval">0</div></div><div class="card"><div class="klabel">Final</div><div id="kFinal" class="kval">0</div></div></div>
    <div class="toolbar"><input id="q" placeholder="Search ticket / subject" oninput="loadTickets()"><select id="step" onchange="loadTickets()"><option value="ALL">ทุก Step</option><option value="1">Step1 Engineer</option><option value="2">Step2 FSO</option><option value="3">Step3 Defend</option><option value="5">Step5 Manager</option><option value="FINAL">Final</option></select><button class="btn ghost" onclick="loadTickets(true)">Reload View</button><button class="btn ghost" onclick="debug()">Debug</button></div>
    <div style="overflow:auto"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
  </div>
</section>
<div id="modal" class="modal"><div class="box"><div class="box-head"><h2 id="mTitle">Ticket</h2><span id="mStep" class="pill"></span><button class="btn ghost close" onclick="closeModal()">Close</button></div><div id="mDetail" class="detail-grid"></div><h3>Step1 Engineer Review</h3><div class="form-grid"><input id="group_problem" placeholder="Group problem"><input id="sub_problem" placeholder="Sub Problem"><input id="accident" placeholder="Accident"><input id="explain_link" placeholder="แนบ LINK ชี้แจง"><textarea id="overdue_detail" placeholder="Overdue Detail / แนบ LINK รูป"></textarea></div><h3>Step2 FSO Review</h3><div class="form-grid"><select id="fso_decision"><option value="">เลือก ปรับ/ไม่ปรับ</option><option>ปรับ</option><option>ไม่ปรับ</option></select><input id="fso_approve" placeholder="FSO approve"><input id="fso_approve_date" type="date"><textarea id="fso_remark" placeholder="Remark FSO"></textarea></div><div id="mActions" class="actions"></div><pre id="mMsg" class="small"></pre></div></div>
<script>
const COLS=[['ticket_id','Ticket'],['step','Step'],['region','Region'],['province','Province'],['severity','Severity'],['creation','Create'],['target','Target'],['subject','Subject'],['penalty','Penalty'],['status','Status'],['act','Action']];
let rows=[],sortKey='penalty',sortDir=-1,current=null;
function token(){return localStorage.getItem('sd_token')||''} function api(url,opt={}){return fetch(url,{...opt,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token(),...(opt.headers||{})}})}
function fmtMoney(n){return Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:0})}
function showApp(user){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('me').textContent=`${user.name||user.user} • ${user.group}/${user.role} • ${user.region} • ${user.province}`;loadTickets()}
async function login(){let r=await api('/api/smart-defense/login',{method:'POST',body:JSON.stringify({user:u.value,pass:p.value})});let j=await r.json();if(!j.ok){loginMsg.textContent=j.error||'login fail';return}localStorage.setItem('sd_token',j.token);localStorage.setItem('sd_user',JSON.stringify(j.user));showApp(j.user)}
function logout(){localStorage.removeItem('sd_token');localStorage.removeItem('sd_user');location.reload()}
async function boot(){let t=token();if(!t)return;let r=await api('/api/smart-defense/me');let j=await r.json();if(j.ok)showApp(j.user);else logout()} boot();
async function loadTickets(force=false){let params=new URLSearchParams(); if(q.value)params.set('q',q.value); if(step.value&&step.value!='ALL')params.set('step',step.value); let r=await api('/api/smart-defense/tickets?'+params.toString());let j=await r.json(); if(!j.ok){warning.innerHTML=`<div class="card err">${j.error||'load error'}</div>`;return} rows=j.rows||[]; renderWarning(j.warning); render();}
function renderWarning(w){warning.innerHTML=''; if(w){warning.innerHTML=`<div class="card warn"><b>Warning:</b> ${w.message||w.type}<br>${w.missing?('Missing: '+w.missing.join(', ')):''}</div>`}}
function sortRows(){rows.sort((a,b)=>{let av=a[sortKey],bv=b[sortKey]; if(sortKey==='penalty'){av=+av||0;bv=+bv||0}else{av=String(av||'');bv=String(bv||'')} return av>bv?sortDir:av<bv?-sortDir:0})}
function render(){sortRows(); thead.innerHTML=COLS.map(c=>`<th onclick="setSort('${c[0]}')">${c[1]} ${sortKey==c[0]?(sortDir>0?'↑':'↓'):''}</th>`).join(''); tbody.innerHTML=rows.map(r=>`<tr>${COLS.map(c=>td(c[0],r)).join('')}</tr>`).join(''); kTotal.textContent=rows.length; kPenalty.textContent=fmtMoney(rows.reduce((s,r)=>s+(+r.penalty||0),0)); kStep1.textContent=rows.filter(r=>String(r.step)==='1').length; kFinal.textContent=rows.filter(r=>String(r.step).toUpperCase()==='FINAL'||r.final_status).length;}
function td(k,r){if(k==='act')return `<td><button class="btn ghost" onclick="openTicket('${r.ticket_id}')">Open</button></td>`; if(k==='penalty')return `<td class="mono">${fmtMoney(r.penalty)}</td>`; if(k==='step')return `<td><span class="pill p${String(r.step).replace('FINAL','f')}">${r.step}</span></td>`; return `<td>${esc(r[k]||'')}</td>`}
function setSort(k){if(k==='act')return;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=k==='penalty'?-1:1}render()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function openTicket(id){mMsg.textContent='';let r=await api('/api/smart-defense/ticket/'+encodeURIComponent(id));let j=await r.json(); if(!j.ok){alert(j.error);return}current=j.ticket; mTitle.textContent=current.ticket_id; mStep.textContent='STEP '+current.step+' • '+current.status; mDetail.innerHTML=['severity','creation','target','region','province','owner','subject','external','penalty'].map(k=>`<div class="field"><label>${k}</label><div>${k==='penalty'?fmtMoney(current[k]):esc(current[k]||'')}</div></div>`).join(''); ['group_problem','sub_problem','accident','overdue_detail','explain_link','fso_decision','fso_approve','fso_approve_date','fso_remark'].forEach(k=>{let el=document.getElementById(k); if(el)el.value=current[k]||''}); renderActions(j.actions||{}); modal.classList.add('show')}
function renderActions(a){let b=[]; if(a.save_step1)b.push(`<button class="btn ghost" onclick="act('save_step1')">Save Step1</button>`); if(a.confirm_step1)b.push(`<button class="btn green" onclick="act('confirm_step1')">Confirm Step1 → FSO</button>`); if(a.fso_decision)b.push(`<button class="btn ghost" onclick="act('fso_decision')">Save FSO</button>`); if(a.confirm_step2)b.push(`<button class="btn amber" onclick="act('confirm_step2')">Confirm FSO Decision</button>`); if(a.request_defend)b.push(`<button class="btn purple" onclick="act('request_defend')">Request Defend</button>`); if(a.accept_final)b.push(`<button class="btn red" onclick="act('accept_final')">Accept / No Defend</button>`); if(a.manager_approve)b.push(`<button class="btn green" onclick="act('manager_approve')">Manager Approve Final</button>`); mActions.innerHTML=b.join('')||'<span class="small">No action available for this role/step</span>'}
async function act(action){let data={ticket_id:current.ticket_id}; ['group_problem','sub_problem','accident','overdue_detail','explain_link','fso_decision','fso_approve','fso_approve_date','fso_remark'].forEach(k=>{let el=document.getElementById(k); if(el)data[k]=el.value}); let r=await api('/api/smart-defense/action/'+action,{method:'POST',body:JSON.stringify(data)}); let j=await r.json(); mMsg.textContent=JSON.stringify(j,null,2); if(j.ok){await loadTickets(true); setTimeout(()=>openTicket(current.ticket_id),500)}}
function closeModal(){modal.classList.remove('show')} async function debug(){let r=await api('/api/smart-defense/debug');let j=await r.json();console.log(j);alert(JSON.stringify({raw:j.raw_count,allowed:j.allowed_count,last_error:j.last_error},null,2))}
</script>
</body></html>
